# Docker Native Plugin Configuration Examples
# Direct streaming from Docker daemon using the native Docker plugin
# Usage: gonzo --config examples/config/docker-native.yml

# Global settings
memory-size: 10000
update-interval: 1s
log-buffer: 2000
skin: default

sources:
  # Example 1: Follow all containers
  - name: all_containers
    type: docker
    config:
      endpoint: unix:///var/run/docker.sock
      interval: 10s
      follow:
        - "*"

  # Example 2: Follow specific application containers
  # - name: app_containers
  #   type: docker
  #   config:
  #     follow:
  #       - "web-app"
